name: build and publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK and Maven authentication
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and validate
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify release tag matches Maven version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Maven version ${version}." >&2
            exit 1
          fi
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "Release tags cannot publish SNAPSHOT versions." >&2
            exit 1
          fi

      - name: Test and publish release to GitHub Packages
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: mvn --batch-mode --no-transfer-progress clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
