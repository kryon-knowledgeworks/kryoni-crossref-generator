name: build and publish to Maven Central

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up JDK, Maven Central credentials, and signing key
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build and validate
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify release tag matches Maven version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Maven version ${version}." >&2
            exit 1
          fi
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "Release tags cannot publish SNAPSHOT versions." >&2
            exit 1
          fi

      - name: Test, sign, and publish release to Maven Central
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: mvn --batch-mode --no-transfer-progress -Pcentral-release clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
